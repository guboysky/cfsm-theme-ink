name: Build Ink Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ink-dist
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build static assets
        run: npm run build
        env:
          API_BASE: ${{ secrets.API_BASE }}
          TITLE: ${{ secrets.TITLE }}
          BACKGROUND_IMAGE: ${{ secrets.BACKGROUND_IMAGE }}
          CSP_API: ${{ secrets.CSP_API }}
          CSP_STATIC: ${{ secrets.CSP_STATIC }}
      - name: Append build to dist history
        shell: bash
        run: |
          set -euo pipefail
          git log -1 --format=%B "$GITHUB_SHA" > "$RUNNER_TEMP/source-message.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          target="$RUNNER_TEMP/ink-pages"
          if git ls-remote --exit-code --heads origin dist >/dev/null 2>&1; then
            git fetch origin dist
            git worktree add --detach "$target" origin/dist
          else
            git worktree add --detach "$target" HEAD
            git -C "$target" checkout --orphan ink-pages-initial
            git -C "$target" rm -rf --ignore-unmatch .
          fi
          rsync -a --delete --exclude=.git dist/ "$target/"
          git -C "$target" add -A
          git -C "$target" commit --allow-empty -F "$RUNNER_TEMP/source-message.txt"
          git -C "$target" push origin HEAD:refs/heads/dist
